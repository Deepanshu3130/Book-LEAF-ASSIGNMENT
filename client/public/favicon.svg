<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bookleaf-coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F77788" />
      <stop offset="100%" stop-color="#D94560" />
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- BookLeaf Coral Squircle -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bookleaf-coral)" />

  <!-- Signature BookLeaf Forward Slash Mark -->
  <line
    x1="40"
    y1="16"
    x2="24"
    y2="48"
    stroke="#FFFFFF"
    stroke-width="5.5"
    stroke-linecap="round"
    filter="url(#subtle-shadow)"
  />
</svg>
